<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>POLYTACK 3D</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <div id="hud">

        <div class="logo">
            POLYTACK
        </div>

        <div class="hud-box">

            <span>
                TIME
            </span>

            <strong id="timer">
                00:00.000
            </strong>

        </div>

    </div>


    <div id="startScreen">

        <div class="panel">

            <h1>POLYTACK</h1>

            <h2>3D RACING</h2>

            <p>
                Race through the track
                and beat your best time.
            </p>

            <button id="startButton">
                START RACE
            </button>

            <div class="controls">

                <div>
                    <b>W / ↑</b>
                    Accelerate
                </div>

                <div>
                    <b>S / ↓</b>
                    Brake
                </div>

                <div>
                    <b>A / ←</b>
                    Steer Left
                </div>

                <div>
                    <b>D / →</b>
                    Steer Right
                </div>

            </div>

        </div>

    </div>


    <div id="finishScreen">

        <div class="panel">

            <h1>FINISH!</h1>

            <p>
                Your time:
            </p>

            <strong
                id="finalTime"
                class="final-time"
            >
                00:00.000
            </strong>

            <button id="restartButton">
                RACE AGAIN
            </button>

        </div>

    </div>


    <script
        type="module"
        src="game.js"
    ></script>

</body>

</html>
